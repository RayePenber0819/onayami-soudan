services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: onayami_soudan_app
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:1.27-alpine
    container_name: onayami_soudan_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: onayami_soudan_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: onayami_soudan
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: